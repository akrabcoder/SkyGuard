<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyGuard | سكاي جارد</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0a0e1a; --bg2:#0f1626; --card:#141b2e; --bd:#1e2a44;
  --acc:#00d4ff; --acc2:#00ff9d; --dgr:#ff3b5c; --wrn:#ffb800;
  --txt:#e6f1ff; --dim:#8899bb;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--txt);overflow:hidden;height:100vh}
html[lang="en"] body{font-family:'Orbitron',sans-serif}

/* Login */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at center,#0f1e3a 0%,#05080f 100%);z-index:2000}
.login-box{background:var(--card);border:1px solid var(--bd);border-radius:20px;
  padding:48px 40px;width:420px;box-shadow:0 0 80px rgba(0,212,255,.1);text-align:center}
.login-logo{color:var(--acc);margin-bottom:32px}
.login-logo h1{font-size:32px;font-weight:900;letter-spacing:4px;margin-top:12px;
  background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-logo p{color:var(--dim);font-size:14px;margin-top:8px}
.login-box input{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;
  padding:14px 16px;color:var(--txt);font-size:15px;font-family:inherit;outline:none;
  width:100%;margin-bottom:14px}
.login-box input:focus{border-color:var(--acc)}
.login-btn{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#000;border:none;
  border-radius:10px;padding:14px;font-size:16px;font-weight:700;font-family:inherit;
  cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:10px}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,212,255,.3)}
.login-hint{margin-top:20px;font-size:12px;color:var(--dim)}

/* App */
#app{display:none;flex-direction:column;height:100vh}
#app.on{display:flex}
.topbar{height:64px;background:var(--bg2);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0}
.tb-left{display:flex;align-items:center;gap:12px}
.logo-txt{font-size:20px;font-weight:900;letter-spacing:3px;
  background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.flight-info{display:flex;align-items:center;gap:10px;background:var(--card);
  border:1px solid var(--bd);border-radius:10px;padding:8px 18px;font-size:14px;color:var(--dim)}
.flight-info b{color:var(--acc)}
.tb-right{display:flex;align-items:center;gap:12px}
.icon-btn{background:var(--card);border:1px solid var(--bd);color:var(--txt);border-radius:10px;
  padding:8px 14px;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit;font-size:13px}
.icon-btn:hover{border-color:var(--acc);color:var(--acc)}
.clock{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);
  border-radius:10px;padding:8px 16px;font-family:'Orbitron',monospace;font-size:14px;color:var(--acc2)}

.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:240px;background:var(--bg2);border-inline-end:1px solid var(--bd);
  display:flex;flex-direction:column;justify-content:space-between;padding:20px 12px;flex-shrink:0}
.nav{display:flex;flex-direction:column;gap:6px}
.nav-item{background:transparent;border:none;color:var(--dim);padding:12px 16px;border-radius:10px;
  display:flex;align-items:center;gap:12px;cursor:pointer;font-family:inherit;font-size:14px;text-align:start}
.nav-item:hover{background:var(--card);color:var(--txt)}
.nav-item.active{background:linear-gradient(90deg,rgba(0,212,255,.15),transparent);
  color:var(--acc);border-inline-start:3px solid var(--acc)}
.status-box{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--card);
  border:1px solid var(--bd);border-radius:10px;font-size:13px;color:var(--dim)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--acc2);
  box-shadow:0 0 10px var(--acc2);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.content{flex:1;overflow:hidden;position:relative}
.tab{display:none;width:100%;height:100%;position:relative}
.tab.on{display:block}

#map{width:100%;height:100%}

/* Emergency btn */
.emg-btn{position:absolute;bottom:30px;inset-inline-start:30px;z-index:1000;
  background:linear-gradient(90deg,var(--dgr),#ff6b3d);color:#fff;border:none;
  border-radius:14px;padding:16px 26px;font-size:16px;font-weight:900;font-family:inherit;
  cursor:pointer;display:flex;align-items:center;gap:10px;box-shadow:0 8px 30px rgba(255,59,92,.5);
  animation:shake 2s infinite}
.emg-btn:hover{transform:scale(1.05)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

/* Info panel */
.info-panel{position:absolute;top:20px;inset-inline-end:20px;z-index:1000;
  background:rgba(20,27,46,.95);border:1px solid var(--bd);border-radius:14px;
  padding:16px 20px;min-width:260px;backdrop-filter:blur(10px)}
.info-row{display:flex;justify-content:space-between;gap:20px;font-size:13px;
  padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.info-row:last-child{border:none}
.info-row span:first-child{color:var(--dim)}
.info-row span:last-child{color:var(--acc);font-weight:700}
.info-row.alert span:last-child{color:var(--dgr)}

.ph{height:100%;background:var(--card);border:1px dashed var(--bd);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--dim)}

/* Plane marker */
.plane-icon{font-size:28px;filter:drop-shadow(0 0 10px var(--acc));transition:transform .5s linear}

::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:10px}
</style>
</head>
<body>

<!-- Login -->
<div id="login">
  <div class="login-box">
    <div class="login-logo">
      <i data-lucide="shield-check" style="width:64px;height:64px"></i>
      <h1>SkyGuard</h1>
      <p data-i18n="sub">نظام مراقبة وتحكم الطيران الذكي</p>
    </div>
    <input id="pid" placeholder="رقم الطيار" value="PLT-001">
    <input id="ppass" type="password" placeholder="كلمة المرور" value="skyguard">
    <button class="login-btn" onclick="login()">
      <i data-lucide="log-in"></i> <span data-i18n="btn">دخول</span>
    </button>
    <p class="login-hint">Demo: PLT-001 / skyguard</p>
  </div>
</div>

<!-- App -->
<div id="app">
  <header class="topbar">
    <div class="tb-left">
      <i data-lucide="shield-check" style="color:var(--acc)"></i>
      <span class="logo-txt">SkyGuard</span>
    </div>
    <div class="flight-info">
      <i data-lucide="plane"></i>
      <b>AA-1024</b> | <span id="routeTxt">CAI → LHR</span>
    </div>
    <div class="tb-right">
      <button class="icon-btn" onclick="toggleLang()">
        <i data-lucide="languages"></i> <span id="langLbl">EN</span>
      </button>
      <button class="icon-btn" onclick="toggleSound()">
        <i data-lucide="volume-2" id="sndIcon"></i>
      </button>
      <div class="clock">
        <i data-lucide="clock"></i> <span id="clock">00:00:00</span>
      </div>
    </div>
  </header>

  <div class="main">
    <aside class="sidebar">
      <nav class="nav">
        <button class="nav-item active" onclick="go('map',this)">
          <i data-lucide="map"></i> <span data-i18n="map">الخريطة</span>
        </button>
        <button class="nav-item" onclick="go('pass',this)">
          <i data-lucide="users"></i> <span data-i18n="pass">الركاب</span>
        </button>
        <button class="nav-item" onclick="go('alerts',this)">
          <i data-lucide="alert-triangle"></i> <span data-i18n="alerts">الإنذارات</span>
        </button>
        <button class="nav-item" onclick="go('log',this)">
          <i data-lucide="file-text"></i> <span data-i18n="log">السجل</span>
        </button>
      </nav>
      <div class="status-box">
        <div class="dot"></div> <span data-i18n="online">النظام يعمل</span>
      </div>
    </aside>

    <main class="content">
      <section class="tab on" id="t-map">
        <div id="map"></div>

        <!-- لوحة المعلومات -->
        <div class="info-panel" id="infoPanel">
          <div class="info-row"><span data-i18n="from">من</span><span>Cairo (CAI)</span></div>
          <div class="info-row"><span data-i18n="to">إلى</span><span id="toTxt">London (LHR)</span></div>
          <div class="info-row"><span data-i18n="speed">السرعة</span><span id="spdTxt">850 km/h</span></div>
          <div class="info-row"><span data-i18n="alt">الارتفاع</span><span id="altTxt">11,000 m</span></div>
          <div class="info-row"><span data-i18n="eta">الوصول المتوقع</span><span id="etaTxt">--</span></div>
        </div>

        <!-- زر الطوارئ -->
        <button class="emg-btn" onclick="emergency()">
          <i data-lucide="alert-octagon"></i>
          <span data-i18n="emg">طوارئ — Emergency</span>
        </button>
      </section>

      <section class="tab" id="t-pass">
        <div class="ph"><i data-lucide="users" style="width:64px;height:64px"></i>
        <h2 data-i18n="passT">مراقبة الركاب</h2><p data-i18n="soon">قريباً</p></div>
      </section>
      <section class="tab" id="t-alerts">
        <div class="ph"><i data-lucide="alert-triangle" style="width:64px;height:64px"></i>
        <h2 data-i18n="alertsT">الإنذارات</h2><p data-i18n="soon">قريباً</p></div>
      </section>
      <section class="tab" id="t-log">
        <div class="ph"><i data-lucide="file-text" style="width:64px;height:64px"></i>
        <h2 data-i18n="logT">السجل</h2><p data-i18n="soon">قريباً</p></div>
      </section>
    </main>
  </div>
</div>

<script>
/* ===== الترجمة ===== */
const TR={
 ar:{sub:"نظام مراقبة وتحكم الطيران الذكي",btn:"دخول",map:"الخريطة",pass:"الركاب",
     alerts:"الإنذارات",log:"السجل",online:"النظام يعمل",from:"من",to:"إلى",
     speed:"السرعة",alt:"الارتفاع",eta:"الوصول المتوقع",emg:"طوارئ — Emergency",
     passT:"مراقبة الركاب",alertsT:"الإنذارات",logT:"السجل",soon:"قريباً",
     nearest:"أقرب مطار",divert:"تحويل المسار إلى"},
 en:{sub:"Smart Flight Monitoring & Control System",btn:"Login",map:"Map",pass:"Passengers",
     alerts:"Alerts",log:"Flight Log",online:"System Online",from:"From",to:"To",
     speed:"Speed",alt:"Altitude",eta:"ETA",emg:"Emergency",
     passT:"Passengers",alertsT:"Alerts",logT:"Log",soon:"Soon",
     nearest:"Nearest Airport",divert:"Diverting to"}
};
let lang=localStorage.getItem('sg_lang')||'ar';
function t(k){return TR[lang][k]||k}
function applyLang(){
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.getAttribute('data-i18n')));
  document.getElementById('langLbl').textContent=lang==='ar'?'EN':'ع';
  localStorage.setItem('sg_lang',lang);
}
function toggleLang(){lang=lang==='ar'?'en':'ar';applyLang()}

/* ===== Login ===== */
function login(){
  const id=document.getElementById('pid').value.trim();
  const pw=document.getElementById('ppass').value.trim();
  if(id==='PLT-001'&&pw==='skyguard'){
    document.getElementById('login').style.display='none';
    document.getElementById('app').classList.add('on');
    setTimeout(()=>{initMap();},100);
    startClock();
  } else alert(lang==='ar'?'بيانات خاطئة!':'Invalid!');
}

/* ===== Clock ===== */
function startClock(){
  setInterval(()=>{
    const d=new Date();
    document.getElementById('clock').textContent=
      String(d.getHours()).padStart(2,'0')+':'+
      String(d.getMinutes()).padStart(2,'0')+':'+
      String(d.getSeconds()).padStart(2,'0');
  },1000);
}

/* ===== Sound ===== */
let sound=true;
function toggleSound(){
  sound=!sound;
  document.getElementById('sndIcon').setAttribute('data-lucide',sound?'volume-2':'volume-x');
  lucide.createIcons();
}

/* ===== Tabs ===== */
function go(id,btn){
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.tab').forEach(c=>c.classList.remove('on'));
  document.getElementById('t-'+id).classList.add('on');
  if(id==='map'&&map) setTimeout(()=>map.invalidateSize(),100);
  lucide.createIcons();
}

/* ===== المطارات ===== */
const AIRPORTS={
  CAI:{name:"Cairo",lat:30.1114,lng:31.4139},
  LHR:{name:"London Heathrow",lat:51.4700,lng:-0.4543},
  ATH:{name:"Athens",lat:37.9364,lng:23.9445},
  IST:{name:"Istanbul",lat:41.2753,lng:28.7519},
  CDG:{name:"Paris CDG",lat:49.0097,lng:2.5479},
  FCO:{name:"Rome",lat:41.8003,lng:12.2389},
  MAD:{name:"Madrid",lat:40.4719,lng:-3.5626},
  VIE:{name:"Vienna",lat:48.1103,lng:16.5697}
};

const START=AIRPORTS.CAI;
const DEST=AIRPORTS.LHR;

let map, planeMarker, routeLine, planeLat, planeLng, progress=0;
let emergencyMode=false;

/* ===== الخريطة ===== */
function initMap(){
  map=L.map('map',{zoomControl:true,attributionControl:false}).setView([42,15],4);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
    maxZoom:19
  }).addTo(map);

  // مطار الإقلاع
  L.circleMarker([START.lat,START.lng],{
    radius:8,color:'#00ff9d',fillColor:'#00ff9d',fillOpacity:1
  }).addTo(map).bindPopup('🛫 '+START.name+' (CAI)');

  // مطار الوصول
  L.circleMarker([DEST.lat,DEST.lng],{
    radius:8,color:'#00d4ff',fillColor:'#00d4ff',fillOpacity:1
  }).addTo(map).bindPopup('🛬 '+DEST.name+' (LHR)');

  // خط الرحلة
  routeLine=L.polyline([[START.lat,START.lng],[DEST.lat,DEST.lng]],{
    color:'#00d4ff',weight:2,dashArray:'8,8',opacity:0.7
  }).addTo(map);

  // الطيارة
  const planeIcon=L.divIcon({
    className:'',
    html:'<div class="plane-icon">✈️</div>',
    iconSize:[30,30],iconAnchor:[15,15]
  });

  planeLat=START.lat; planeLng=START.lng;
  planeMarker=L.marker([planeLat,planeLng],{icon:planeIcon}).addTo(map);

  // ابدأ الحركة
  movePlane();
}

/* ===== حركة الطيارة ===== */
function movePlane(){
  setInterval(()=>{
    if(emergencyMode) return;
    if(progress>=1) return;

    progress+=0.002;
    if(progress>1) progress=1;

    planeLat=START.lat+(DEST.lat-START.lat)*progress;
    planeLng=START.lng+(DEST.lng-START.lng)*progress;
    planeMarker.setLatLng([planeLat,planeLng]);

    // ETA تقريبي
    const remainH=Math.max(0,Math.round((1-progress)*5));
    document.getElementById('etaTxt').textContent=remainH+'h';
  },200);
}

/* ===== الطوارئ ===== */
function emergency(){
  if(emergencyMode) return;
  emergencyMode=true;

  // لاقي أقرب مطار
  let nearest=null, minDist=Infinity;
  Object.keys(AIRPORTS).forEach(code=>{
    const a=AIRPORTS[code];
    const d=Math.hypot(a.lat-planeLat,a.lng-planeLng);
    if(d<minDist){minDist=d; nearest={code,...a};}
  });

  // غيّر الخط للطوارئ
  routeLine.setStyle({color:'#ff3b5c',weight:3,dashArray:'4,4'});
  routeLine.setLatLngs([[planeLat,planeLng],[nearest.lat,nearest.lng]]);

  // نقطة المطار الأقرب
  L.circleMarker([nearest.lat,nearest.lng],{
    radius:10,color:'#ff3b5c',fillColor:'#ff3b5c',fillOpacity:1
  }).addTo(map).bindPopup('🆘 '+t('nearest')+': '+nearest.name).openPopup();

  // حرّك الطيارة ناحية المطار
  let p=0;
  const fromLat=planeLat, fromLng=planeLng;
  const timer=setInterval(()=>{
    p+=0.01;
    if(p>=1){clearInterval(timer);return;}
    const lat=fromLat+(nearest.lat-fromLat)*p;
    const lng=fromLng+(nearest.lng-fromLng)*p;
    planeMarker.setLatLng([lat,lng]);
  },150);

  // حدّث اللوحة
  document.getElementById('toTxt').textContent=nearest.name+' ('+nearest.code+')';
  document.getElementById('routeTxt').textContent='CAI → '+nearest.code;
  document.getElementById('etaTxt').textContent='~15 min';

  // خلفية حمراء
  document.body.style.background='#1a0a0f';
  alert('🚨 '+t('divert')+' '+nearest.name+'!');
}

/* ===== Start ===== */
window.addEventListener('DOMContentLoaded',()=>{
  applyLang();
  lucide.createIcons();
  document.getElementById('ppass').addEventListener('keypress',e=>{
    if(e.key==='Enter') login();
  });
});
</script>
</body>
</html>
